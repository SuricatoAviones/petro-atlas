name: Error
description: Reportar un fallo reproducible en la web, la API o el paquete.
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportar. No incluyas datos personales, credenciales ni CSV reales.
        Para vulnerabilidades usa el enlace de seguridad, no un issue público.
  - type: textarea
    id: summary
    attributes:
      label: Qué ocurre
      description: Resumen breve y claro del fallo.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abrir ...
        2. Seleccionar ...
        3. Ver ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Resultado actual
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área
      options:
        - Mapa
        - Ficha del pozo
        - Producción u operación
        - Registros o LAS
        - Ingeniería o diagnóstico
        - Importación CSV
        - Comparación
        - Idiomas o accesibilidad
        - API
        - Paquete petro-calc
        - Despliegue
        - Otro
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Entorno
      description: Sistema, navegador, idioma y si ocurre en la demo o en local.
      placeholder: 'Windows 11, Chrome 142, español, demo pública'
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Capturas o registros
      description: Arrastra capturas o pega errores de consola sin datos sensibles.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Comprobaciones
      options:
        - label: He buscado un issue parecido.
          required: true
        - label: No incluyo credenciales ni datos personales.
          required: true
