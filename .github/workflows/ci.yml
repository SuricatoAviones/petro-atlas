name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Start the seeded database for the API route tests
        run: |
          docker compose up --detach --wait db
          docker compose run --rm db-setup
      - run: pnpm test
      - name: Install the Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm test:e2e
      - run: pnpm build

  compose:
    name: docker compose up (RNF-05)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack
        run: docker compose up --detach --build --wait
      - name: API health check answers through the read-only role
        run: curl --fail --silent --show-error http://localhost:4000/api/health | grep '"database":"ok"'
      - name: Web serves the Spanish map page
        run: curl --fail --silent --show-error http://localhost:3000/es | grep 'PetroAtlas'
      - name: Web serves the English legal page
        run: curl --fail --silent --show-error http://localhost:3000/en/aviso-legal | grep 'PetroAtlas'
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
